<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROFILE TEST 관리자</title><style>body{font-family:system-ui,sans-serif;background:#f4f7fc;color:#142b50;margin:0}main{max-width:1050px;margin:30px auto;padding:20px}.panel{background:white;border:1px solid #d9e2f1;border-radius:14px;padding:20px;margin-bottom:15px}input,button,select{padding:11px;border-radius:8px;border:1px solid #ccd7e8;font-size:15px}button{background:#174d9c;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #e1e7f0;padding:10px;text-align:left;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.muted{color:#65738a}#details{display:none}label{display:block;margin:8px 0}a{color:#174d9c}</style></head><body><main><h1>서윤희 입시영어학원 · PROFILE TEST 관리자</h1><p class="muted">관리자 로그인 후 검사 결과를 조회합니다. 결과에는 민감할 수 있는 학생 정보가 포함됩니다.</p><section class="panel" id="login"><h2>관리자 로그인</h2><label>이메일 <input type="email" id="email" autocomplete="username"></label><label>비밀번호 <input type="password" id="password" autocomplete="current-password"></label><button onclick="login()">로그인</button><p id="notice" role="status"></p></section><section class="panel" id="dashboard" hidden><button onclick="logout()">로그아웃</button> <button onclick="load()">새로고침</button><h2>검사 결과 <span id="count"></span></h2><p id="stats"></p><label>학생 검색 <input id="search" oninput="draw()" placeholder="이름 또는 학교"></label><label><input type="checkbox" id="onlyConsult" onchange="draw()"> 상담 동의자만</label><div style="overflow:auto"><table><thead><tr><th>검사일</th><th>학생</th><th>중학교</th><th>추천 1순위</th><th>상담 동의</th><th>결과</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="panel" id="details"><h2>학생 검사 상세</h2><div id="detailBody"></div><button onclick="window.print()">현재 화면 인쇄</button></section><p class="muted">운영 전 Supabase 인증 계정 및 관리자 허용 목록을 설정해야 합니다.</p></main><script>
// 배포 전에 Supabase 프로젝트의 공개 URL과 anon key만 넣으세요. service_role key는 절대 넣지 마세요.
const SUPABASE_URL='REPLACE_WITH_SUPABASE_URL',SUPABASE_ANON_KEY='REPLACE_WITH_SUPABASE_ANON_KEY';let token='',items=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function login(){if(SUPABASE_URL.startsWith('REPLACE')){ $('notice').textContent='배포 전 admin.html에 Supabase URL 및 공개 anon key를 설정해 주세요.';return}const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok){$('notice').textContent='로그인 실패: 계정을 확인해 주세요.';return}token=d.access_token;await load()}
async function load(){const r=await fetch('/.netlify/functions/profile-api',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){$('notice').textContent=d.error||'조회 실패';return}items=d.items;$('login').hidden=true;$('dashboard').hidden=false;$('count').textContent=items.length+'명';$('stats').textContent='상담 동의 '+items.filter(x=>x.consult_consent).length+'명';draw()}
function draw(){const q=$('search').value.trim(),consult=$('onlyConsult').checked;const list=items.filter(x=>(!consult||x.consult_consent)&&(!q||[x.student_name,x.middle_school].some(v=>String(v).includes(q))));$('rows').innerHTML=list.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString('ko-KR'))}</td><td>${esc(x.student_name)}</td><td>${esc(x.middle_school)}</td><td>${esc(x.recommendations?.[0]?.school)}</td><td>${x.consult_consent?'동의':'미동의'}</td><td><button onclick="show('${esc(x.id)}')">보기</button></td></tr>`).join('')}
function show(id){const x=items.find(v=>v.id===id);if(!x)return;$('details').style.display='block';$('detailBody').innerHTML=`<p><b>학생:</b> ${esc(x.student_name)} (${esc(x.middle_school)})</p><p><b>학부모:</b> ${esc(x.parent_name)} / ${esc(x.parent_phone)}</p><p><b>상담 연락 동의:</b> ${x.consult_consent?'예':'아니오'} · <b>동의 버전:</b> ${esc(x.consent_version)} · <b>동의 시각:</b> ${esc(x.consented_at)}</p><h3>추천학교</h3><pre>${esc(JSON.stringify(x.recommendations,null,2))}</pre><h3>학생 프로필</h3><pre>${esc(JSON.stringify(x.profile,null,2))}</pre><h3>18문항 응답</h3><pre>${esc(x.answers.join(' / '))}</pre>`;$('details').scrollIntoView({behavior:'smooth'})}
function logout(){token='';items=[];$('login').hidden=false;$('dashboard').hidden=true;$('details').style.display='none';$('password').value=''}
</script></body></html>
