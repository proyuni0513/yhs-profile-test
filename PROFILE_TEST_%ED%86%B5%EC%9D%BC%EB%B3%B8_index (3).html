function examCard(s, isRecommended){
 const detail=(s.examDetail||s.exam||'');
 // 모든 학교에 동일한 다섯 항목을 표시하되, 원문에 없는 수치는 생성하지 않습니다.
 const evidenceSentences=detail.match(/[^.!?。]+[.!?。]?/g)||[];
 let evidence='';
 for(const part of evidenceSentences){
   const t=part.trim(); if(!t)continue;
   if(evidence && (evidence.length+t.length)>235)break;
   evidence+=(evidence?' ':'')+t;
 }
 if(!evidence)evidence=detail.slice(0,235);
 const safe=(v)=>String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
 const row=(num,label,val)=>`<div class="exam-field uniform-evidence-row"><b>${num}. ${label}</b><p>${safe(val)}</p></div>`;
 return `<article class="card exam-card ${isRecommended?'priority-exam':''}">
 <h3>${safe(s.name)} 영어 내신 분석</h3>
 <div class="exam-field"><b>출제 특징</b><p>${safe(s.examSummary)}</p></div>
 <div class="exam-field"><b>핵심 변형·대비</b><p>${safe(s.examPrep)}</p></div>
 <div class="exam-field"><b>학생 우선 점검</b><p>${englishNeeds(s)}</p></div>
 <details class="evidence-details"><summary>기출 근거 자세히 보기</summary>
 ${row('01','분석 대상',s.examYear||'자료의 학년·시기 확인 필요')}
 ${row('02','출제 특징',s.examSummary||'구체적 출제 구성 확인 필요')}
 ${row('03','변형·대비 요소',s.examPrep||'변형 유형 확인 필요')}
 ${row('04','확인된 기출 근거',evidence||'세부 문항 근거 확인 필요')}
 ${row('05','학생별 우선 점검',englishNeeds(s))}
 <details class="source-long"><summary>원본 분석 메모 전체 보기</summary><p class="small">${safe(detail||'추가 분석 자료 확인 필요')}</p></details>
 </details></article>`;
}

function careerEvidence(s){let c=careers[st.first];if(c==='AI·SW·데이터'||c==='공학')return safe(s.ai);if(c==='인문·사회·상경')return safe(s.social);if(c==='자연과학'||c==='의생명·바이오')return safe(s.science);return '진로 미정: 수학·과학 / 정보 / 인문·사회 과목을 폭넓게 비교';}
function reason(s){let c=careers[st.first];let a=c==='아직 미정'?'진로를 아직 탐색 중이므로 선택 폭을 비교할 필요가 있습니다.':c+' 관심에 맞는 편성 과목을 검토할 수 있습니다.';let t='통학은 중요도와 허용시간을 참고해 실제 경로를 별도로 비교해 주세요.';return safe(a+' '+t+' 단, 실제 개설·수강 가능 여부는 학교에 확인해야 합니다.');}
